general {
    hide_cursor = false
}

animations {
    enabled = true

    bezier = easeOut, 0.25, 1, 0.5, 1

    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldWidth, 1, 3, easeOut
    animation = inputFieldColors, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8

    brightness = 0.8
    contrast = 1.1
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    font_size = 80
    font_family = Poppins

    color = rgba(ffffffff)

    position = 0, 350
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = Poppins

    color = rgba(ccccccff)

    position = 0, 270
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 360, 60

    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3

    rounding = 30

    outer_color = rgba(ffffffee)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(ffffffff)

    fade_on_empty = false

    placeholder_text = Enter Password

    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =

    text = logout   
    font_size = 20
    font_family = Material Symbols Rounded

    color = rgba(ffffffff)

    position = -155, 35
    halign = right
    valign = bottom

    onclick = hyprctl dispatch 'hl.dsp.exit()'
}

label {
    monitor =

    text = refresh
    
    font_size = 20
    font_family = Material Symbols Rounded

    color = rgba(ffffffff)

    position = -100, 35
    halign = right
    valign = bottom

    onclick = systemctl reboot
}

label {
    monitor =

    text = power_settings_new
    
    font_size = 20
    font_family = Material Symbols Rounded

    color = rgba(ffffffff)

    position = -45, 35
    halign = right
    valign = bottom

    onclick = systemctl poweroff
}
